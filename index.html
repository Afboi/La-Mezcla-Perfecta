<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>La Mezcla Perfecta - Live View</title>
	<style>
		* { box-sizing: border-box; }
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
		}

		/* Main grid layout: 3 columns (side margins sized by aspect-ratio, not px) x 2 rows (stage + bottom bar) */
		body {
			display: grid;
			grid-template-columns: auto 1fr auto;
			grid-template-rows: 1fr auto;
			gap: 0;
		}

		/* Gradient margins fill the background */
		body::before {
			content: '';
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: -1;
			background-image:
				radial-gradient(circle at 10% 20%, #F16BFC 0%, rgba(241,107,252,0.85) 12%, transparent 30%),
				radial-gradient(circle at 80% 30%, #C06AFC 0%, rgba(192,106,252,0.85) 12%, transparent 30%),
				radial-gradient(circle at 50% 80%, #FC6ABB 0%, rgba(252,106,187,0.85) 12%, transparent 30%),
				radial-gradient(circle at 20% 80%, #906AFC 0%, rgba(144,106,252,0.85) 12%, transparent 30%),
				radial-gradient(circle at 85% 70%, #FC6C6A 0%, rgba(252,108,106,0.85) 12%, transparent 30%);
			background-color: #1a0a2e;
			background-size: 130% 130%;
			filter: blur(28px);
			opacity: 0.95;
			animation: bgPan 10s ease-in-out infinite alternate;
		}

		@keyframes bgPan {
			0%{background-position:0% 0%}
			100%{background-position:30% 30%}
		}

		/* Grain texture overlay */
		body::after {
			content: '';
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			z-index: -1;
			background-image: repeating-radial-gradient(circle at 20% 20%, rgba(255,255,255,0.02) 0 1px, transparent 1px 3px);
			mix-blend-mode: overlay;
			opacity: 0.06;
			animation: bgShift 8s linear infinite;
		}

		@keyframes bgShift {
			0%{background-position:0% 0%}
			100%{background-position:200% 200%}
		}

		/* Side margins: width is derived from height via aspect-ratio (256:1024 = 1:4),
		   NOT a fixed pixel value, so they scale down together with the stage on smaller screens. */
		#marginLeft, #marginRight {
			grid-row: 1;
			height: 100%;
			aspect-ratio: 256 / 1024;
			background: transparent;
			z-index: 1;
			min-width: 0;
		}
		#marginLeft { grid-column: 1; }
		#marginRight { grid-column: 3; }

		/* Center app area (row 1, fills remaining width) */
		#appContainer {
			grid-column: 2;
			grid-row: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0;
			background: transparent;
			z-index: 2;
			min-width: 0;
			min-height: 0;
			overflow: hidden;
		}

		/* Bottom bar: its own row, sized to content (auto), spans all columns */
		#bottomBar {
			grid-column: 1 / 4;
			grid-row: 2;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 16px;
			color: #fff;
			background: rgba(0, 0, 0, 0.3);
			border-top: 1px solid rgba(255,255,255,0.1);
			z-index: 2;
		}

		/* App wrapper: 16:9 box, size is set explicitly in px by JS (layoutStage()) so it always
		   fits inside #appContainer without being clipped or collapsing to 0 in a flex parent. */
		.app-ratio {
			position: relative;
			background: #000;
			border-radius: 8px;
			overflow: hidden;
			box-shadow: 0 20px 60px rgba(0,0,0,0.5);
			flex: none;
		}

		.app-inner {
			position: absolute;
			inset: 0;
			display: flex;
			flex-direction: column;
			background: #080316;
		}

		/* Game board */
		.embedded-game {
			flex: 1;
			position: relative;
			overflow: hidden;
			background: #080316;
			min-height: 0;
		}

		.tablero {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			background-image: url('/resources/Plantilla.jpg');
			background-size: contain;
			background-repeat: no-repeat;
			background-position: center center;
		}

		.zona-titulo {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 20%;
			background: transparent;
			cursor: pointer;
			z-index: 10;
		}

		.casilla {
			position: absolute;
			border: none;
			background: transparent;
			padding: 0;
			margin: 0;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.casilla img {
			width: 75%;
			height: 75%;
			object-fit: contain;
			opacity: 0;
			transform: scale(0.7);
			transition: opacity 0.15s ease, transform 0.15s ease;
		}

		.casilla.activa img {
			opacity: 1;
			transform: scale(1);
		}

		.casilla.especial img {
			opacity: 1;
			transform: scale(1);
		}

		.fila1 { top: 30.8%; height: 13.2%; }
		.fila2 { top: 47%; height: 13.6%; }
		.fila3 { top: 63.1%; height: 13.6%; }
		.fila4 { top: 79%; height: 13.8%; }

		.ronda1 { left: 33.1%; width: 10%; }
		.ronda2 { left: 44.4%; width: 10%; }
		.ronda3 { left: 55.9%; width: 10%; }
		.ronda4 { left: 67%; width: 10%; }

		.total { left: 78%; width: 10%; cursor: default; }

		.numero-total {
			font-family: Arial, Helvetica, sans-serif;
			font-size: clamp(24px, 3vw, 60px);
			font-weight: bold;
			color: #000;
			line-height: 1;
			user-select: none;
		}

		/* UI Elements */
		.three-placeholders {
			display: flex;
			gap: 8px;
			padding: 8px;
			background: rgba(17,17,17,0.9);
			color: #fff;
			flex-wrap: wrap;
		}

		.ph {
			flex: 1;
			min-width: 100px;
			background: rgba(34,34,34,0.9);
			border-radius: 6px;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 12px;
			font-size: 12px;
		}

		.view-grid {
			display: grid;
			grid-template-columns: repeat(5, 1fr);
			gap: 6px;
			padding: 12px;
			background: rgba(243,244,246,0.1);
			overflow-y: auto;
			max-height: 200px;
		}

		.cell {
			background: rgba(255,255,255,0.1);
			border: 1px solid rgba(200,200,200,0.3);
			padding: 12px;
			border-radius: 4px;
			text-align: center;
			font-size: 11px;
			color: rgba(255,255,255,0.8);
		}

		.cell.marked {
			background: rgba(11,121,255,0.7);
			color: #fff;
			border-color: rgba(7,91,181,0.7);
		}

		/* Status elements */
		.status-text {
			opacity: 0.95;
			position: relative;
			z-index: 3;
			font-size: 14px;
		}

		.players-display {
			font-weight: 600;
			margin-right: 16px;
			flex: 0 0 auto;
			white-space: nowrap;
		}

		#bottomBar {
			flex-wrap: wrap;
		}

		/* Scene overlay */
		#sceneOverlay {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 9999;
			align-items: center;
			justify-content: center;
		}

		#sceneBackdrop {
			position: absolute;
			inset: 0;
			background: rgba(0,0,0,0.45);
			backdrop-filter: blur(8px);
			-webkit-backdrop-filter: blur(8px);
		}

		#sceneCanvas {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			pointer-events: none;
		}

		#sceneContent {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			inset: 0;
			padding: 20px;
		}

		#sceneText {
			color: #fff;
			font-weight: 700;
			text-align: center;
			font-size: clamp(32px, 8vw, 160px);
			text-shadow: 0 6px 18px rgba(0,0,0,0.6);
			opacity: 0;
			transform: scale(0.9);
			transition: opacity 400ms ease, transform 600ms cubic-bezier(.22,.9,.3,1);
		}
	</style>
</head>
<body>
	<!-- Left margin (gradient) -->
	<div id="marginLeft"></div>

	<!-- Center app area -->
	<div id="appContainer">
		<div class="app-ratio">
			<div class="app-inner">
				<!-- Game board -->
				<div class="embedded-game">
					<div class="tablero">
						<div class="zona-titulo" id="zonaTitulo"></div>
						<!-- Row 1 -->
						<button class="casilla fila1 ronda1"><img src="/resources/Logo.png" alt="Punto"></button>
						<button class="casilla fila1 ronda2"><img src="/resources/Logo.png" alt="Punto"></button>
						<button class="casilla fila1 ronda3"><img src="/resources/Logo.png" alt="Punto"></button>
						<button class="casilla fila1 ronda4"><img src="/resources/Logo.png" alt="Punto"></button>
						<div class="casilla fila1 total"><span class="numero-total" id="total1">0</span></div>
						<!-- Row 2 -->
						<button class="casilla fila2 ronda1"><img src="/resources/Logo.png" alt="Punto"></button>
						<button class="casilla fila2 ronda2"><img src="/resources/Logo.png" alt="Punto"></button>
						<button class="casilla fila2 ronda3"><img src="/resources/Logo.png" alt="Punto"></button>
						<button class="casilla fila2 ronda4"><img src="/resources/Logo.png" alt="Punto"></button>
						<div class="casilla fila2 total"><span class="numero-total" id="total2">0</span></div>
						<!-- Row 3 -->
						<button class="casilla fila3 ronda1"><img src="/resources/Logo.png" alt="Punto"></button>
						<button class="casilla fila3 ronda2"><img src="/resources/Logo.png" alt="Punto"></button>
						<button class="casilla fila3 ronda3"><img src="/resources/Logo.png" alt="Punto"></button>
						<button class="casilla fila3 ronda4"><img src="/resources/Logo.png" alt="Punto"></button>
						<div class="casilla fila3 total"><span class="numero-total" id="total3">0</span></div>
						<!-- Row 4 -->
						<button class="casilla fila4 ronda1"><img src="/resources/Logo.png" alt="Punto"></button>
						<button class="casilla fila4 ronda2"><img src="/resources/Logo.png" alt="Punto"></button>
						<button class="casilla fila4 ronda3"><img src="/resources/Logo.png" alt="Punto"></button>
						<button class="casilla fila4 ronda4"><img src="/resources/Logo.png" alt="Punto"></button>
						<div class="casilla fila4 total"><span class="numero-total" id="total4">0</span></div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Right margin (gradient) -->
	<div id="marginRight"></div>

	<!-- Bottom bar -->
	<div id="bottomBar">
		<div class="players-display" id="playersDisplay">Pareja 1 · Pareja 2 · Pareja 3 · Pareja 4</div>
		<div class="status-text" id="statusText">Ready</div>
	</div>

	<!-- Scene overlay -->
	<div id="sceneOverlay">
		<div id="sceneBackdrop"></div>
		<canvas id="sceneCanvas" width="800" height="600"></canvas>
		<div id="sceneContent">
			<div id="sceneText"></div>
		</div>
	</div>

	<script>
		// Size the 16:9 app box to fit #appContainer exactly (contain-fit), driven by ResizeObserver
		// instead of relying on CSS auto+aspect-ratio inside a flex parent (which collapses to 0x0).
		(function(){
			const APP_RATIO = 16 / 9;
			const container = document.getElementById('appContainer');
			const stage = document.querySelector('.app-ratio');
			if(!container || !stage) return;

			function layoutStage(){
				const cw = container.clientWidth;
				const ch = container.clientHeight;
				if(cw <= 0 || ch <= 0) return;
				let w = cw, h = w / APP_RATIO;
				if(h > ch){ h = ch; w = h * APP_RATIO; }
				stage.style.width = Math.round(w) + 'px';
				stage.style.height = Math.round(h) + 'px';
			}

			new ResizeObserver(layoutStage).observe(container);
			window.addEventListener('resize', layoutStage);
			layoutStage();
		})();

		// Game board logic
		(function(){
			const container = document.querySelector('.embedded-game');
			if(!container) return;
			const casillas = Array.from(container.querySelectorAll('.casilla:not(.total)'));
			let modoLogo2 = false;
			const zonaTitulo = container.querySelector('#zonaTitulo');

			if(zonaTitulo){
				zonaTitulo.addEventListener('click', ()=>{
					modoLogo2 = !modoLogo2;
					console.log(modoLogo2? 'Modo logo x2 ACTIVADO' : 'Modo logo x2 DESACTIVADO');
				});
			}

			casillas.forEach((casilla) => {
				casilla.addEventListener('click', ()=>{
					if(modoLogo2){
						if(casilla.classList.contains('ronda4')){
							const imagen = casilla.querySelector('img');
							if(casilla.classList.contains('especial')){
								imagen.src = '/resources/Logo.png';
								imagen.alt='Punto';
								casilla.classList.remove('especial','activa');
							} else {
								imagen.src = '/resources/Logo2.png';
								imagen.alt='2 puntos';
								casilla.classList.add('especial','activa');
							}
							actualizarTotales();
						}
						return;
					}
					casilla.classList.toggle('activa');
					if(!casilla.classList.contains('activa') && casilla.classList.contains('especial')){
						const imagen = casilla.querySelector('img');
						imagen.src = '/resources/Logo.png';
						imagen.alt='Punto';
						casilla.classList.remove('especial');
					}
					actualizarTotales();
				});
			});

			function actualizarTotales(){
				for(let pareja=1; pareja<=4; pareja++){
					const fila = Array.from(container.querySelectorAll('.fila'+pareja+':not(.total)'));
					let puntos = 0;
					fila.forEach(c=>{
						if(c.classList.contains('activa')){
							puntos += c.classList.contains('especial')?2:1;
						}
					});
					const el = container.querySelector('#total'+pareja);
					if(el) el.textContent = puntos;
				}
			}

			document.addEventListener('keydown', (event)=>{
				if(event.key === 'Escape'){
					casillas.forEach(c=>{
						c.classList.remove('activa','especial');
						const imagen = c.querySelector('img');
						if(imagen){
							imagen.src = '/resources/Logo.png';
							imagen.alt='Punto';
						}
					});
					modoLogo2 = false;
					actualizarTotales();
				}
			});

			window.setEmbeddedSpace = function(idx, value){
				const c = casillas[idx];
				if(!c) return;
				if(value){
					c.classList.add('activa');
				} else {
					c.classList.remove('activa');
					c.classList.remove('especial');
					const imagen = c.querySelector('img');
					if(imagen){
						imagen.src = '/resources/Logo.png';
						imagen.alt='Punto';
					}
				}
				actualizarTotales();
			};
		})();

		// SSE connection
		let playerNames = ['Pareja 1','Pareja 2','Pareja 3','Pareja 4'];

		function renderPlayers(){
			const el = document.getElementById('playersDisplay');
			if(!el) return;
			el.textContent = playerNames.join(' · ');
		}

		const es = new EventSource('/events');
		es.onopen = () => {
			document.getElementById('statusText').textContent = '✅ Connected';
		};
		es.onmessage = (e) => {
			try{
				const data = JSON.parse(e.data);
				if(data.type === 'control'){
					document.getElementById('statusText').textContent = `${data.action}`;
					if (typeof window.showScene === 'function') window.showScene(data.action);
				} else if (data.type === 'names'){
					if(Array.isArray(data.names)){
						playerNames = data.names.map(n => String(n || '').trim() || '');
						renderPlayers();
					}
				} else if (data.type === 'space'){
					const idx = Number(data.index);
					if(typeof window.setEmbeddedSpace === 'function'){
						try{ window.setEmbeddedSpace(idx, !!data.value); }catch(e){ console.warn('setEmbeddedSpace failed',e); }
					}
				}
			}catch(err){ console.error('Event parse error:', e.data); }
		};
		es.onerror = ()=>{
			document.getElementById('statusText').textContent = '⚠️ Connection lost';
		};

		renderPlayers();

		// Scene overlay
		(function(){
			const overlay = document.getElementById('sceneOverlay');
			const canvas = document.getElementById('sceneCanvas');
			const ctx = canvas.getContext('2d');
			const sceneText = document.getElementById('sceneText');
			const appRatio = document.querySelector('.app-ratio');

			let raf = null;
			let particles = [];
			let running = false;
			let hideTimeout = null;

			function fitCanvas(){
				const dpr = window.devicePixelRatio || 1;
				canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
				canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
				ctx.setTransform(dpr,0,0,dpr,0,0);
			}
			window.addEventListener('resize', fitCanvas);
			fitCanvas();

			function rand(min,max){ return Math.random()*(max-min)+min }

			function createParticles(color){
				particles = [];
				const count = 80;
				for(let i=0;i<count;i++){
					particles.push({
						x: rand(0, canvas.width),
						y: rand(0, canvas.height),
						vx: rand(-0.6,0.6),
						vy: rand(-1.5,-0.2),
						r: rand(1,4),
						life: rand(120,280),
						age: 0,
						color
					});
				}
			}

			function draw(){
				ctx.clearRect(0,0,canvas.width,canvas.height);
				for(let p of particles){
					p.age++;
					p.x += p.vx * 2;
					p.y += p.vy * 2 - (p.age/200);
					const alpha = Math.max(0, 1 - p.age / p.life);
					ctx.beginPath();
					ctx.fillStyle = `rgba(${p.color.r},${p.color.g},${p.color.b},${alpha})`;
					ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
					ctx.fill();
				}
				particles = particles.filter(p => p.age < p.life);
				if(particles.length === 0) stop();
				else raf = requestAnimationFrame(draw);
			}

			function start(){
				if(running) return;
				running = true;
				fitCanvas();
				raf = requestAnimationFrame(draw);
			}

			function stop(){
				running = false;
				if(raf) cancelAnimationFrame(raf);
				raf = null;
			}

			function showScene(action){
				if(hideTimeout) { clearTimeout(hideTimeout); hideTimeout = null }
				const map = {
					'Iniciar Juego 1': {text:'PRIMER JUEGO: LA COREOGRAFÍA', color:{r:10,g:150,b:255}},
					'Iniciar Juego 2': {text:'SEGUNDO JUEGO: EL CORTEJO', color:{r:10,g:200,b:120}},
					'Iniciar Juego 3': {text:'TERCER JUEGO: LOS GLOBOS', color:{r:240,g:90,b:90}},
					'Iniciar Juego 4': {text:'CUARTO JUEGO: CANTALA SI PUEDES', color:{r:200,g:120,b:240}},
					'Pareja Ganadora': {text:'PAREJA GANADORA', color:{r:255,g:200,b:40}},
					'Intento Fallido': {text:'INTENTO FALLIDO', color:{r:180,g:30,b:30}}
				};
				const cfg = map[action] || {text:action.toUpperCase(), color:{r:255,g:255,b:255}};

				if(appRatio) appRatio.style.filter = 'blur(6px)';

				sceneText.style.opacity = '0';
				sceneText.style.transform = 'scale(0.9)';
				sceneText.textContent = cfg.text;
				overlay.style.display = 'flex';

				createParticles(cfg.color);
				start();

				requestAnimationFrame(()=>{
					sceneText.style.opacity = '1';
					sceneText.style.transform = 'scale(1)';
				});

				hideTimeout = setTimeout(()=>{
					sceneText.style.opacity = '0';
					sceneText.style.transform = 'scale(0.9)';
					setTimeout(()=>{
						overlay.style.display = 'none';
						if(appRatio) appRatio.style.filter = '';
					}, 400);
				}, 2800);
			}

			window.showScene = showScene;
		})();
	</script>
</body>
</html>
